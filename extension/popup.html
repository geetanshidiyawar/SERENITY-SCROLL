<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serenity</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">

            <h1>🌿 Serenity</h1>

            <p>
                Your digital wellbeing companion
            </p>

        </div>


        <!-- Monitoring status -->
        <div class="status">

            <span class="status-dot"></span>

            <span>Monitoring</span>

        </div>


        <!-- Activity section -->
        <div class="section">

            <h2>Today's Activity</h2>

            <div id="sites">

                Loading...

            </div>

        </div>


        <!-- Total time -->
        <div class="total">

            <span>
                Total browsing time
            </span>

            <strong id="totalTime">
                0 min
            </strong>

        </div>


        <!-- Footer -->
        <div class="footer">

            Serenity helps you build
            healthier browsing habits. 🌱

        </div>

    </div>


    <!-- Popup JavaScript -->
    <script src="popup.js"></script>

</body>

</html>
